<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <nav id="top">
      <div class="brand"><b>Factory</b><span id="meta">connecting</span></div>
      <div id="tabs" role="tablist"></div>
      <button id="panel-toggle" type="button" title="Show or hide the side panel">Panel</button>
    </nav>
    <main id="canvas">
      <svg id="wires" aria-hidden="true"></svg>
      <div id="rows"></div>
    </main>
    <aside id="panel"></aside>
    <div id="ask">
      <div id="ask-sheet" hidden>
        <div id="ask-head"><span id="ask-q"></span><button id="ask-close" type="button" aria-label="Close">×</button></div>
        <div id="ask-log"></div>
      </div>
      <form id="ask-form" autocomplete="off">
        <input id="ask-input" placeholder="Ask the factory, or say: skip qa-review on this job" spellcheck="false" />
        <span class="engine"><i></i>Claude Code</span>
        <button id="ask-send" type="submit" aria-label="Send">↑</button>
      </form>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
