<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-factory.svg" />
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <nav id="top">
      <button id="side-toggle" type="button" aria-label="Show or hide the boards list" aria-expanded="true" title="Boards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
      </button>
      <div class="brand"><b>Factory</b><span id="meta">connecting</span></div>
      <div id="boardtabs" role="tablist" aria-label="Open boards"></div>
      <div id="filters" role="tablist"></div>
      <button id="panel-toggle" type="button" title="Show or hide the side panel">Panel</button>
    </nav>
    <aside id="side" aria-label="Boards">
      <div class="sidehead">Boards</div>
      <div id="boardlist"></div>
      <p class="sidehint">Drag a board onto the tabs to open it, or onto another board to reorder.</p>
    </aside>
    <main id="canvas">
      <div id="stage"><div id="rows"><svg id="wires" aria-hidden="true"></svg><div id="lanes"></div></div></div>
      <div id="zoom"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="zoom-fit" type="button" aria-label="Fit to window">⤢</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button></div>
    </main>
    <aside id="panel"></aside>
    <div id="ask">
      <div id="ask-sheet" hidden>
        <div id="ask-head"><kbd id="ask-esc" title="Press Esc to close">esc</kbd><span id="ask-q"></span><button id="ask-close" type="button" aria-label="Close">×</button></div>
        <div id="ask-log"></div>
      </div>
      <form id="ask-form" autocomplete="off">
        <textarea id="ask-input" rows="1" placeholder="Ask anything. Say: skip qa-review, or turn off simplify" spellcheck="false"></textarea>
        <div id="ask-opts">
          <div id="modes" role="radiogroup" aria-label="What the agent may do"></div>
          <div id="engines" role="radiogroup" aria-label="CLI that answers"></div>
          <span class="grow"></span>
          <button class="pill flat" id="ask-history" type="button" title="Show or hide the chat log">Log</button>
          <div class="menu" id="model-wrap">
            <button class="pill flat" id="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Model for this CLI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg><span id="model-label">model</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
            <div class="pop" id="model-pop" role="listbox" aria-label="Model" hidden></div>
          </div>
          <div class="menu" id="effort-wrap">
            <button class="pill flat" id="effort-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Effort"><svg id="effort-icon" viewBox="0 0 24 24" aria-hidden="true"><rect class="b" x="3" y="15" width="3.5" height="6" rx="1"/><rect class="b" x="8.5" y="11" width="3.5" height="10" rx="1"/><rect class="b" x="14" y="7" width="3.5" height="14" rx="1"/><rect class="b" x="19.5" y="3" width="3.5" height="18" rx="1"/></svg><span id="effort-label">effort</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
            <div class="pop" id="effort-pop" role="listbox" aria-label="Effort" hidden></div>
          </div>
          <button id="ask-send" type="submit" aria-label="Send">↑</button>
        </div>
      </form>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
