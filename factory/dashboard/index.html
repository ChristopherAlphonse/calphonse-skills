<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <nav id="top">
      <button id="side-toggle" type="button" aria-label="Show or hide the boards list" aria-expanded="true" title="Boards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
      </button>
      <div class="brand"><b>Factory</b><span id="meta">connecting</span></div>
      <div id="boardtabs" role="tablist" aria-label="Open boards"></div>
      <div id="filters" role="tablist"></div>
      <button id="panel-toggle" type="button" title="Show or hide the side panel">Panel</button>
    </nav>
    <aside id="side" aria-label="Boards">
      <div class="sidehead">Boards</div>
      <div id="boardlist"></div>
      <p class="sidehint">Drag a board onto the tabs to open it, or onto another board to reorder.</p>
    </aside>
    <main id="canvas">
      <div id="stage"><div id="rows"><svg id="wires" aria-hidden="true"></svg><div id="lanes"></div></div></div>
      <div id="zoom"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="zoom-fit" type="button" aria-label="Fit to window">⤢</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button></div>
    </main>
    <aside id="panel"></aside>
    <div id="ask">
      <div id="ask-sheet" hidden>
        <div id="ask-head"><span id="ask-q"></span><button id="ask-close" type="button" aria-label="Close">×</button></div>
        <div id="ask-log"></div>
      </div>
      <form id="ask-form" autocomplete="off">
        <textarea id="ask-input" rows="1" placeholder="Ask anything. Say: skip qa-review, or turn off simplify" spellcheck="false"></textarea>
        <div id="ask-opts">
          <div id="engines" role="radiogroup" aria-label="CLI that answers"></div>
          <span class="grow"></span>
          <label class="sel" id="model-wrap" title="Model for this CLI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/><path d="M19 16v4M17 18h4"/></svg><select class="pill flat" id="model"><option value="">model</option></select></label>
          <label class="sel" title="Effort"><svg id="effort-icon" viewBox="0 0 24 24" aria-hidden="true"><rect class="b" x="3" y="15" width="3.500" height="6" rx="1"/><rect class="b" x="8.500" y="11" width="3.500" height="10" rx="1"/><rect class="b" x="14" y="7" width="3.500" height="14" rx="1"/><rect class="b" x="19.500" y="3" width="3.500" height="18" rx="1"/></svg><select class="pill flat" id="effort"><option value="">effort</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label>
          <button id="ask-send" type="submit" aria-label="Send">↑</button>
        </div>
      </form>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
