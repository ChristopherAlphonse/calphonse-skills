<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Factory</h1>
        <span id="meta">connecting</span>
      </div>
      <p class="policy">Local only. The factory never pushes or opens a PR/MR, and it commits only when you click.</p>
    </header>
    <main id="board"></main>
    <aside id="drawer">
      <button class="x" id="close">Close</button>
      <button class="x" id="reset" title="Reset drawer width">Reset width</button>
      <div id="dhead"></div>
      <div id="dneeds"></div>
      <div class="files" id="dfiles"></div>
      <div id="dbody" class="raw"></div>
    </aside>
    <button id="grip" type="button" aria-label="Resize drawer"></button>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
