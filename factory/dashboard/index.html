<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <nav id="top">
      <div class="brand"><b>Factory</b><span id="meta">connecting</span></div>
      <div id="tabs" role="tablist"></div>
      <button id="panel-toggle" type="button" title="Show or hide the side panel">Panel</button>
    </nav>
    <main id="canvas">
      <svg id="wires" aria-hidden="true"></svg>
      <div id="rows"></div>
    </main>
    <aside id="panel"></aside>
    <div id="ask">
      <div id="ask-sheet" hidden>
        <div id="ask-head"><span id="ask-q"></span><button id="ask-close" type="button" aria-label="Close">×</button></div>
        <div id="ask-log"></div>
      </div>
      <form id="ask-form" autocomplete="off">
        <textarea id="ask-input" rows="1" placeholder="Ask anything. Say: skip qa-review, or turn off simplify" spellcheck="false"></textarea>
        <div id="ask-opts">
          <button class="pill flat" id="engine" type="button" title="Switch the CLI that answers"><i></i><span id="engine-name">Claude Code</span></button>
          <span class="grow"></span>
          <input class="pill flat" id="model" list="models" placeholder="model" spellcheck="false" title="Model for this CLI. Empty uses its default." />
          <datalist id="models"></datalist>
          <select class="pill flat" id="effort" title="Effort"><option value="">effort</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select>
          <button id="ask-send" type="submit" aria-label="Send">↑</button>
        </div>
      </form>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
