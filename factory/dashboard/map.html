<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory map</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
    <link rel="stylesheet" href="/static/map.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Factory map</h1>
        <a href="/">Board</a>
        <span id="meta">connecting</span>
      </div>
      <p class="policy">Hover a node to see what feeds it and what it feeds. Click it to read its files. Lit nodes hold a job right now.</p>
    </header>
    <main>
      <svg id="map" viewBox="0 0 1600 560" role="group" aria-label="Build workflow stages and how they connect">
        <defs>
          <marker id="head-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head up" /></marker>
          <marker id="head-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head down" /></marker>
        </defs>
        <g id="heads"></g>
        <g id="nodes"></g>
        <g id="edges"></g>
        <g id="labels"></g>
      </svg>
      <ul id="legend">
        <li><i class="sw agent"></i>Agent stage</li>
        <li><i class="sw script"></i>Script</li>
        <li><i class="sw human"></i>You</li>
        <li><i class="sw end"></i>End state</li>
        <li><i class="ln up"></i>Hover: feeds this</li>
        <li><i class="ln down"></i>Hover: this feeds</li>
      </ul>
    </main>
    <aside id="drawer" aria-label="Stage files">
      <button class="x" id="close">Close</button>
      <button class="x" id="reset" title="Reset drawer width">Reset width</button>
      <div id="dhead"></div>
      <div class="files" id="djobs"></div>
      <div class="files" id="dfiles"></div>
      <div id="dbody" class="raw"></div>
    </aside>
    <button id="grip" type="button" aria-label="Resize drawer"></button>
    <script type="module" src="/static/map.js"></script>
  </body>
</html>
