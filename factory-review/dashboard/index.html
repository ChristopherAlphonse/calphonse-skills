<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory-review Board</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <header>
      <h1>Factory-review Board</h1>
      <span id="meta">connecting</span>
      <span class="policy">local only: factory-review never edits code, commits, pushes, or posts a comment</span>
    </header>
    <main id="board"></main>
    <aside id="drawer">
      <button class="x" id="close">close</button>
      <div id="dhead"></div>
      <div class="files" id="dfiles"></div>
      <div id="dbody" class="raw"></div>
    </aside>
    <div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize drawer" tabindex="0"></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
